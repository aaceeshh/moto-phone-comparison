# .github/workflows/daily_price_update.yml
# 4 batches spread through the day — ~63 models each, 5s delay between requests
# Batch 0: 06:00 AM IST → models   1– 63
# Batch 1: 09:00 AM IST → models  64–126
# Batch 2: 12:00 PM IST → models 127–189
# Batch 3: 03:00 PM IST → models 190–252
# All batches MERGE into one prices.json — earlier results are preserved

name: Daily Price Update

on:
  schedule:
    - cron: '30 0 * * *'   # Batch 0 — 06:00 AM IST
    - cron: '30 3 * * *'   # Batch 1 — 09:00 AM IST
    - cron: '30 6 * * *'   # Batch 2 — 12:00 PM IST
    - cron: '30 9 * * *'   # Batch 3 — 03:00 PM IST
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch number to run (0-3), or leave empty to run all'
        required: false
        default: ''

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine batch number
        id: batch
        run: |
          # If manually triggered with a batch number, use that
          if [ -n "${{ github.event.inputs.batch }}" ]; then
            echo "num=${{ github.event.inputs.batch }}" >> $GITHUB_OUTPUT
          else
            # Determine batch from current hour (IST = UTC+5:30)
            HOUR_UTC=$(date -u +%H)
            if [ "$HOUR_UTC" = "00" ]; then echo "num=0" >> $GITHUB_OUTPUT
            elif [ "$HOUR_UTC" = "03" ]; then echo "num=1" >> $GITHUB_OUTPUT
            elif [ "$HOUR_UTC" = "06" ]; then echo "num=2" >> $GITHUB_OUTPUT
            else echo "num=3" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Pull latest prices.json (to merge with)
        run: git pull --rebase origin main || true

      - name: Run price scraper (Batch ${{ steps.batch.outputs.num }})
        run: python price_scraper.py ${{ steps.batch.outputs.num }}

      - name: Commit and push updated prices.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Prices batch ${{ steps.batch.outputs.num }} — $(TZ='Asia/Kolkata' date +'%d %b %Y %H:%M IST')"
          git push
