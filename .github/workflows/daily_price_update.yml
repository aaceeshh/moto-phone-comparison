name: Daily Price Updater — 10am IST

on:
  schedule:
    # 10:00am IST = 04:30 UTC (IST is UTC+5:30)
    - cron: '30 4 * * *'

  # Also allows manual trigger from GitHub website
  workflow_dispatch:

jobs:
  scrape-prices:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out your repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      # Step 4: Run the price scraper
      - name: Run price scraper
        run: python price_scraper.py

      # Step 5: Commit and push updated prices.json back to repo
      - name: Commit updated prices
        run: |
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add prices.json scraper_log.txt
          git diff --staged --quiet || git commit -m "💰 Auto price update $(date +'%d %b %Y %H:%M IST' --date='TZ=\"Asia/Kolkata\" now')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
